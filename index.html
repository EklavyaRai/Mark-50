<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Childhood - Cartoon Details</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body class="netflix-interface">

    <!-- Header Navbar -->
    <header class="navbar netflix-nav">
        <div class="logo">Child<span>hood</span></div>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="#">TV Shows</a>
            <a href="#">Movies</a>
            <a href="#">New & Popular</a>
        </nav>
    </header>

    <!-- Hero Feature Banner -->
    <section class="hero-banner" id="heroBanner">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <div class="badge-tag">#1 in Shows Today</div>
            <h1 class="hero-title" id="showTitle">Loading...</h1>
            <p class="hero-description" id="showDescription">Loading details...</p>
            
            <div class="hero-buttons">
                <button class="btn btn-play" id="playBtn">▶ Play</button>
                <button class="btn btn-info" id="moreInfoBtn">ⓘ More Info</button>
            </div>
        </div>
    </section>

    <!-- Dynamic Section for More Shows from Same Category -->
    <section class="content-area netflix-content">
        <div class="cartoon-section">
            <h2 class="section-title" id="categoryTitle">More Shows</h2>
            <div class="cartoon-grid" id="relatedGrid"></div>
        </div>
    </section>

    <footer class="footer">
        <p>&copy; 2026 Childhood Cartoon Portal. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            initShowPage();
        });
    </script>
</body>
</html>

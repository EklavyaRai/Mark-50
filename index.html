<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cartoon Stream</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- Font Awesome for Play and Info Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- In doremon/index.html Header Navbar -->
<header class="navbar netflix-nav">
    <div class="logo">Child<span>hood</span></div>
    <nav class="nav-links">
        <!-- Back to Main Page Link -->
        <a href="../index.html">← Back to Main Home</a>
        <a href="#">TV Shows</a>
        <a href="#">Cartoons</a>
        <a href="#">New & Popular</a>
        <a href="#">My List</a>
    </nav>
</header>

  <!-- Top Navigation Bar -->
  <header class="navbar">
    <div class="nav-left">
      <!-- Replaced Netflix logo with your website name -->
      <h1 class="brand-logo" id="site-logo">CARTOON HUB</h1>
      <nav class="nav-links">
        <a href="#" class="active" onclick="filterCategory('all', event)">Home</a>
        <a href="#" onclick="filterCategory('action', event)">Action</a>
        <a href="#" onclick="filterCategory('comedy', event)">Comedy</a>
        <a href="#" onclick="filterCategory('sci-fi', event)">Sci-Fi</a>
        <a href="#" onclick="filterCategory('popular', event)">Popular</a>
      </nav>
    </div>
  </header>

  <!-- Hero / Featured Banner Area -->
  <section class="hero-banner" id="hero-banner">
    <div class="banner-overlay"></div>
    <div class="hero-content">
      <!-- Title of the currently selected cartoon -->
      <h1 class="show-title" id="hero-title">Cartoon Title</h1>
      
      <!-- Ranking / Tag line -->
      <div class="badge-ranking" id="hero-badge">#1 in Cartoons Today</div>
      
      <!-- Brief short summary -->
      <p class="hero-description" id="hero-desc">
        Short description about the cartoon episode or movie will appear here.
      </p>

      <!-- Action Buttons -->
      <div class="hero-buttons">
        <button class="btn btn-play" id="play-btn">
          <i class="fa-solid fa-play"></i> Play
        </button>
        <button class="btn btn-info" id="info-btn">
          <i class="fa-solid fa-circle-info"></i> More Info
        </button>
      </div>
    </div>
  </section>

  <!-- Slider / Carousel Section -->
  <main class="content-section">
    <h2 class="section-title" id="section-heading">Popular on Cartoon Hub</h2>
    <div class="cards-container" id="cards-container">
      <!-- Dynamic cartoon thumbnails will be populated here by JavaScript -->
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Madhur - Web Player: Music for everyone</title>
  <link rel="stylesheet" href="styles.css">
  <!-- FontAwesome for Spotify-style icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="app-container">
    <!-- Spotify Left Navigation Sidebar -->
    <aside class="sidebar">
      <div class="logo">
        <i class="fa-brands fa-spotify logo-icon"></i>
        <span class="logo-text">Madhur</span>
      </div>

      <nav class="nav-menu">
        <ul>
          <li class="active"><a href="#"><i class="fa-solid fa-house"></i> Home</a></li>
          <li><a href="#"><i class="fa-solid fa-magnifying-glass"></i> Search</a></li>
        </ul>
      </nav>

      <div class="library-section">
        <div class="library-header">
          <button class="lib-btn"><i class="fa-solid fa-book-bookmark"></i> Your Library</button>
          <button class="add-btn"><i class="fa-solid fa-plus"></i></button>
        </div>

        <div class="library-box">
          <h4>Create your first playlist</h4>
          <p>It's easy, we'll help you</p>
          <button class="badge-btn">Create playlist</button>
        </div>

        <div class="library-box">
          <h4>Let's find some podcasts to follow</h4>
          <p>We'll keep you updated on new episodes</p>
          <button class="badge-btn">Browse podcasts</button>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-view">
      <!-- Spotify Top Navigation Header -->
      <header class="top-bar">
        <div class="nav-buttons">
          <button class="circle-btn"><i class="fa-solid fa-chevron-left"></i></button>
          <button class="circle-btn"><i class="fa-solid fa-chevron-right"></i></button>
        </div>

        <!-- Search Bar -->
        <div class="search-container">
          <i class="fa-solid fa-magnifying-glass search-icon"></i>
          <input type="text" id="search-input" placeholder="What do you want to play?">
        </div>

        <div class="user-menu">
          <button class="badge-btn white">Explore Premium</button>
          <button class="badge-btn dark"><i class="fa-regular fa-circle-down"></i> Install App</button>
          <button class="circle-btn user-avatar"><i class="fa-regular fa-user"></i></button>
        </div>
      </header>

      <!-- Category Filter Pills -->
      <div class="category-pills">
        <button class="pill active">All</button>
        <button class="pill">Music</button>
        <button class="pill">Podcasts</button>
      </div>

      <!-- Music Cards Sections -->
      <section class="music-section">
        <div class="section-header">
          <h2>Popular Radio & Tracks</h2>
          <a href="#" class="show-all">Show all</a>
        </div>
        <div class="grid-container" id="music-grid">
          <!-- Track Cards dynamically rendered via JavaScript -->
        </div>
      </section>
    </main>
  </div>

  <!-- Spotify Sticky Bottom Player Bar -->
  <footer class="player-bar">
    <!-- Left: Now Playing Info -->
    <div class="now-playing">
      <img id="player-img" src="https://picsum.photos/id/1018/100/100" alt="Album Cover">
      <div class="track-details">
        <h4 id="player-title">Select a Song</h4>
        <p id="player-artist">Madhur Music</p>
      </div>
      <button class="icon-btn" id="like-btn"><i class="fa-regular fa-heart"></i></button>
    </div>

    <!-- Center: Audio Player Controls -->
    <div class="player-controls">
      <div class="control-buttons">
        <button class="icon-btn" id="shuffle-btn"><i class="fa-solid fa-shuffle"></i></button>
        <button class="icon-btn" id="prev-btn"><i class="fa-solid fa-backward-step"></i></button>
        <button class="play-main" id="play-btn"><i class="fa-solid fa-play"></i></button>
        <button class="icon-btn" id="next-btn"><i class="fa-solid fa-forward-step"></i></button>
        <button class="icon-btn" id="repeat-btn"><i class="fa-solid fa-repeat"></i></button>
      </div>
      <div class="playback-bar">
        <span id="current-time">0:00</span>
        <input type="range" id="progress-bar" value="0" min="0" max="100">
        <span id="duration-time">0:00</span>
      </div>
    </div>

    <!-- Right: Volume & Extra Controls -->
    <div class="volume-controls">
      <button class="icon-btn"><i class="fa-solid fa-microphone"></i></button>
      <button class="icon-btn"><i class="fa-solid fa-layer-group"></i></button>
      <i class="fa-solid fa-volume-high" id="volume-icon"></i>
      <input type="range" id="volume-bar" value="80" min="0" max="100">
    </div>
  </footer>

  <!-- Hidden Audio Element -->
  <audio id="audio-element"></audio>

  <script src="script.js"></script>
</body>
</html>
